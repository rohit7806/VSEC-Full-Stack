<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Login</title>
    <link rel="stylesheet" href="style1.css">
    <style>
        /* Styling for the criteria list below the input */
        .crypto-box {
            text-align: left;
            margin: 5px 0 15px 0;
            font-size: 13px;
        }
        .criterion {
            color: #ff4d4d; /* Red by default */
            margin-bottom: 4px;
            display: flex;
            align-items: center;
        }
        .criterion.valid {
            color: #2ecc71; /* Green when met */
        }
        .criterion::before {
            content: "✖ ";
            margin-right: 6px;
        }
        .criterion.valid::before {
            content: "✔ ";
        }
    </style>
</head>
<body>
<nav>
    <a href="index.html">Home</a>
    <a href="login.html" style="color: #f4b400; font-weight: bold;">Student Login</a>
    <a href="signup.html">Register</a>
</nav>
<div class="login-box">
    <h2>Player Login</h2>
    <form id="loginForm">
        <input type="email" placeholder="Registered Email" required>
        
        <input type="password" id="password" placeholder="Password" required>
        
        <!-- Live criteria tracker list directly below the field -->
        <div class="crypto-box">
            <div id="length" class="criterion">At least 8 characters</div>
            <div id="number" class="criterion">At least 1 number</div>
            <div id="special" class="criterion">At least 1 special character (@, $, !, etc.)</div>
        </div>
        
        <button type="submit">Login to Dashboard</button>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
