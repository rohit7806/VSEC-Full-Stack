<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Academy Registration</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f7f6; }
        nav { background-color: #0f2027; padding: 15px; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; }
        .reg-box { background: white; width: 350px; margin: 40px auto; padding: 30px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0f2027; margin-bottom: 20px; }
        input, select { width: 93%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; background-color: #f4b400; color: #0f2027; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Student Login</a>
        <a href="signup.html" style="color: #f4b400; font-weight: bold;">Register</a>
    </nav>

    <div class="reg-box">
        <h2>Academy Registration</h2>
        <form>
            <input type="text" placeholder="Player's Full Name" required>
            <input type="number" placeholder="Age" min="5" max="25" required>
            <select required>
                <option value="">Select Specialty</option>
                <option value="batsman">Batsman</option>
                <option value="bowler">Bowler</option>
                <option value="allrounder">All-Rounder</option>
                <option value="wicketkeeper">Wicket-Keeper</option>
            </select>
            <input type="email" placeholder="Parent's Email" required>
            <button type="submit">Submit Application</button>
        </form>
    </div>

</body>
</html>
