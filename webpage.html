<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Youtube Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>SimpleTube</header>
    <div class="container">
        <main class="main-content">
            <div class="video-player">
                ▶ Video Playing Area
            </div>
            <div class="video-title">Learn How to Hit Sixes more efficiently !!</div>
            <div class="video-stats">12,23,456 views • Jul 13, 2026</div>
        </main>
        <aside class="sidebar">
            <h3>Up Next</h3>
            <div class="videocard">
                <div class="thumbnail"></div>
                <div class="card-info">
                    <h4>How to make your logic in strong in DSA?</h4>
                    <p>RR Academy</p>
                    <p>123K views</p>
                </div>
            </div>
            <div class="video-card">
                <div class="thumbnail"></div>
                <div class="card-info">
                    <h4>JavaScript for Beginners</h4>
                    <p>Tech Guy</p>
                    <p>500K views</p>
                </div>
            </div>
        </aside>
    </div>
</body>
</html>
